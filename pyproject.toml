[project]
name = "system-one-responsible-ai"
version = "0.1.0"
description = "Understanding the biases and limitations of system one models."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "David Lustig" }]
dependencies = [
  "python-dotenv>=1.0",
  "typesafe-sdk>=0.7",
  "pandas>=2.2",
  "openai>=3.16.2",
    "matplotlib>=3.11.2",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/system_one"]

[tool.hatch.build.targets.wheel.sources]
src = ""

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["system_one", "explainability", "stress_tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
